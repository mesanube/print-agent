name: publish-wiki-outbox

on:
  pull_request:
    paths:
      - 'docs/wiki-outbox/**'
  push:
    branches:
      - main
    paths:
      - 'docs/wiki-outbox/**'

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate staged outbox articles
        run: node scripts/wiki-outbox/validate.js docs/wiki-outbox

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OS_REPO: ${{ vars.OS_REPO || 'mesanube/os' }}
    steps:
      - name: Check out source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate staged outbox articles
        run: node scripts/wiki-outbox/validate.js docs/wiki-outbox
      - name: Collect staged files
        id: collect
        run: |
          {
            echo "articles<<EOF"
            node --input-type=module -e "
              import { listOutboxFiles } from './scripts/wiki-outbox/outbox.js';
              for (const rel of listOutboxFiles('docs/wiki-outbox').articles) console.log(rel);
            "
            echo "EOF"
            echo "retractions<<EOF"
            node --input-type=module -e "
              import fs from 'node:fs';
              import { listOutboxFiles, parseDocument } from './scripts/wiki-outbox/outbox.js';
              for (const rel of listOutboxFiles('docs/wiki-outbox').retractions) {
                const { frontmatter } = parseDocument(fs.readFileSync('docs/wiki-outbox/' + rel, 'utf8'));
                console.log(frontmatter.payload_slug);
              }
            "
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Stop when the outbox is empty
        if: steps.collect.outputs.articles == '' && steps.collect.outputs.retractions == ''
        run: echo "Outbox empty, nothing to propose to OS."
      - name: Check out OS wiki
        if: steps.collect.outputs.articles != '' || steps.collect.outputs.retractions != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OS_REPO }}
          token: ${{ secrets.OS_WIKI_TOKEN }}
          path: os-wiki
      - name: Open OS pull request carrying the outbox
        if: steps.collect.outputs.articles != '' || steps.collect.outputs.retractions != ''
        env:
          GH_TOKEN: ${{ secrets.OS_WIKI_TOKEN }}
        run: |
          BRANCH="wiki-outbox/${{ github.sha }}"
          cd os-wiki
          git checkout -b "$BRANCH"
          while IFS= read -r rel; do
            [ -z "$rel" ] && continue
            mkdir -p "wiki/$(dirname "$rel")"
            cp "../docs/wiki-outbox/$rel" "wiki/$rel"
            git add "wiki/$rel"
          done <<< "${{ steps.collect.outputs.articles }}"
          while IFS= read -r slug; do
            [ -z "$slug" ] && continue
            if [ -f "wiki/product/${slug}.md" ]; then
              git rm -q "wiki/product/${slug}.md"
            fi
          done <<< "${{ steps.collect.outputs.retractions }}"
          git -c user.name="mesanube-outbox" -c user.email="outbox@mesanube.ar" \
            commit -m "docs(wiki): stage articles from ${{ github.repository }}@${{ github.sha }}"
          git push origin "$BRANCH"
          gh pr create --repo "$OS_REPO" --head "$BRANCH" --base main \
            --title "docs(wiki): articles from ${{ github.repository }}@${{ github.sha }}" \
            --body "Carries the wiki outbox staged in ${{ github.repository }} commit ${{ github.sha }}. The curator agent reviews and merges."
      - name: Clear the outbox in the source repo
        if: steps.collect.outputs.articles != '' || steps.collect.outputs.retractions != ''
        run: |
          for list in articles retractions; do
            case "$list" in
              articles) content="${{ steps.collect.outputs.articles }}" ;;
              retractions) content="${{ steps.collect.outputs.retractions }}" ;;
            esac
            while IFS= read -r rel; do
              [ -z "$rel" ] && continue
              git rm -q "docs/wiki-outbox/$rel"
            done <<< "$content"
          done
          git -c user.name="mesanube-outbox" -c user.email="outbox@mesanube.ar" \
            commit -m "chore(docs): clear wiki outbox after proposing to OS"
          git pull --rebase origin main
          git push origin HEAD:main
