name: Release

on:
  push:
    tags:
      - "v*"
  # Lets auto-tag-release.yml invoke this directly after it creates+pushes a
  # tag. A tag pushed with the default GITHUB_TOKEN does NOT fire the `push`
  # trigger above (GitHub suppresses workflow runs triggered by the default
  # token, to prevent infinite loops), so relying on that chain silently
  # never runs a release. An explicit workflow_call has no such restriction.
  workflow_call:
    inputs:
      tag:
        description: "Tag to build/publish (e.g. v1.5.1). Defaults to the triggering push's tag."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${TAG_REF#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_REF does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
        env:
          TAG_REF: ${{ inputs.tag || github.ref_name }}

      - name: Build and publish Windows installer
        run: yarn electron-builder --win --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # auto-tag-release.yml invokes this workflow via workflow_call from a
          # `pull_request: closed` trigger, so GITHUB_EVENT_NAME is inherited as
          # "pull_request". electron-builder's CI detection reads that and
          # silently skips publishing (it assumes an untrusted fork PR build),
          # even with --publish=always. This isn't a fork build, it only runs
          # after merge to main with secrets already scoped via
          # `secrets: inherit`, so forcing the publish here is safe.
          PUBLISH_FOR_PULL_REQUEST: true
